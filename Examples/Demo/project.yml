name: SwiftChatDemo
options:
  bundleIdPrefix: com.unionst
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    DEVELOPMENT_TEAM: VL7Q9NW3G8
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SwiftChatClient:
    path: ../..
  SwiftChat:
    url: https://github.com/unionst/swift-chat.git
    from: 1.0.8
targets:
  SwiftChatDemo:
    type: application
    platform: iOS
    sources:
      - path: Demo
    info:
      path: Demo/Info.plist
      properties:
        CFBundleDisplayName: Swift Chat
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Pick photos to send in a conversation.
    dependencies:
      - package: SwiftChatClient
        product: SwiftChatClient
      - package: SwiftChat
        product: SwiftChat
